<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" role="img">
  <title>图2：BECH 消融阶梯 A0-A4</title>
  <desc>累积阶梯 (n=5)：A0 v0 → A1 +L1幅度头 → A2 +贝叶斯门控 → A3 +两层证书 → A4 +S2b复用，平均 MAE 增益单调递增从 +0.22% 到 +1.69%，45次运行零净退化。底部红色为移除 SCARR 对照。</desc>

  <rect x="20" y="20" width="640" height="320" fill="#1a1a1a" rx="8"/>
  <text x="40" y="48" font-size="14" font-weight="500" fill="#f1efe8" font-family="system-ui,sans-serif">图2：消融阶梯 — 活跃组 MAE 增益归因</text>
  <text x="40" y="65" font-size="11" fill="#888780" font-family="system-ui,sans-serif">累积阶梯 (n=5)，每步只追加一项改动。45次阶梯×组合运行净退化: 0 次</text>

  <line x1="40" y1="78" x2="640" y2="78" stroke="#444441" stroke-width="0.5"/>
  <text x="40" y="98" font-size="11" fill="#888780" font-family="system-ui,sans-serif">MAE↓ vs base（活跃组平均）</text>

  <g font-family="monospace" font-size="12">
    <text x="40" y="132" fill="#B4B2A9">A0 v0</text>
    <rect x="100" y="120" width="40" height="14" rx="2" fill="#5DCAA5" opacity="0.55"/>
    <text x="146" y="132" fill="#f1efe8">+0.22%</text>
    <text x="640" y="132" fill="#888780" text-anchor="end" font-size="10">基线：伤害率上限网格搜 τ，取最大 λ</text>

    <text x="40" y="156" fill="#B4B2A9">A1 +L1幅度</text>
    <rect x="100" y="144" width="90" height="14" rx="2" fill="#5DCAA5" opacity="0.6"/>
    <text x="196" y="156" fill="#f1efe8">+0.50%</text>
    <text x="640" y="156" fill="#888780" text-anchor="end" font-size="10">重尾残差下 L2 过度校正 → 中位数目标</text>

    <text x="40" y="180" fill="#B4B2A9">A2 +贝叶斯门 τ=0.5</text>
    <rect x="100" y="168" width="142" height="14" rx="2" fill="#5DCAA5" opacity="0.65"/>
    <text x="248" y="180" fill="#f1efe8">+0.79%</text>
    <text x="640" y="180" fill="#888780" text-anchor="end" font-size="10">绝对误差损失下理论最优阈值，无调参</text>

    <text x="40" y="204" fill="#B4B2A9">A3 +两层证书</text>
    <rect x="100" y="192" width="290" height="14" rx="2" fill="#5DCAA5" opacity="0.7"/>
    <text x="396" y="204" fill="#042C53" font-weight="500">+1.60%</text>
    <text x="640" y="204" fill="#888780" text-anchor="end" font-size="10">效能层 LCB + 安全层共形上界</text>

    <text x="40" y="228" fill="#f1efe8" font-weight="500">A4 +S2b复用 (=v1)</text>
    <rect x="100" y="216" width="306" height="14" rx="2" fill="#5DCAA5" opacity="0.85"/>
    <text x="412" y="228" fill="#042C53" font-weight="500">+1.69%</text>
    <text x="640" y="228" fill="#888780" text-anchor="end" font-size="10">S2b 未被任何选择消耗 → 并入标定集</text>
  </g>

  <line x1="40" y1="260" x2="640" y2="260" stroke="#444441" stroke-width="0.5"/>

  <g font-family="system-ui,sans-serif">
    <rect x="40" y="276" width="600" height="40" rx="4" fill="rgba(240,149,149,0.12)" stroke="#F09595" stroke-width="0.5"/>
    <text x="56" y="296" font-size="12" fill="#F09595" font-weight="500">移除 SCARR (λ≡1) 对照</text>
    <text x="56" y="312" font-size="11" fill="#F09595" font-family="monospace">平均 MAE -0.28% (由正转负) · 3/9 组合退化 · 最坏伤害 124.22 → 1615.53 (×13)</text>
  </g>
</svg>