<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img">
  <title>图1：BECH 基座无关性 + NEM_SA1 主战场明细</title>
  <desc>左：5 个基座在 SCARR 认证组合上的平均 MAE 改善（水平柱）；右：NEM_SA1 上 base 与 +BECH 的 MAE 对比，5/5 基座 DM p&lt;0.01。</desc>

  <rect x="20" y="20" width="640" height="340" fill="#1a1a1a" rx="8"/>

  <text x="40" y="48" font-size="14" font-weight="500" fill="#f1efe8" font-family="system-ui,sans-serif">图1：基座无关性 + NEM_SA1 主战场明细</text>
  <line x1="40" y1="60" x2="640" y2="60" stroke="#444441" stroke-width="0.5"/>

  <text x="40" y="84" font-size="13" font-weight="500" fill="#f1efe8" font-family="system-ui,sans-serif">左：各基座平均 MAE 改善（活跃组）</text>
  <text x="40" y="100" font-size="11" fill="#888780" font-family="system-ui,sans-serif">覆盖 5 种异构归纳偏置，增益方向一致</text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="40" y="128" fill="#B4B2A9">Linear</text>
    <rect x="100" y="116" width="240" height="16" rx="2" fill="rgba(93,202,165,0.55)" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="346" y="128" fill="#f1efe8" font-family="monospace">+1.77%</text>

    <text x="40" y="156" fill="#B4B2A9">MLP</text>
    <rect x="100" y="144" width="180" height="16" rx="2" fill="rgba(93,202,165,0.65)" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="286" y="156" fill="#f1efe8" font-family="monospace">+1.32%</text>

    <text x="40" y="184" fill="#B4B2A9">LSTM</text>
    <rect x="100" y="172" width="60" height="16" rx="2" fill="rgba(93,202,165,0.45)" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="166" y="184" fill="#f1efe8" font-family="monospace">+0.42%</text>

    <text x="40" y="212" fill="#B4B2A9">Transformer</text>
    <rect x="100" y="200" width="50" height="16" rx="2" fill="rgba(93,202,165,0.45)" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="156" y="212" fill="#f1efe8" font-family="monospace">+0.35%</text>

    <text x="40" y="240" fill="#B4B2A9">GBDT</text>
    <rect x="100" y="228" width="210" height="16" rx="2" fill="rgba(93,202,165,0.65)" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="316" y="240" fill="#f1efe8" font-family="monospace">+1.53%</text>
  </g>

  <line x1="40" y1="260" x2="640" y2="260" stroke="#444441" stroke-width="0.5"/>

  <text x="40" y="284" font-size="13" font-weight="500" fill="#f1efe8" font-family="system-ui,sans-serif">右：NEM_SA1 base vs +BECH MAE</text>
  <text x="40" y="300" font-size="11" fill="#888780" font-family="system-ui,sans-serif">2599 负价事件 | 5/5 基座 DM p&lt;0.01</text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="40" y="328" fill="#B4B2A9">Linear</text>
    <rect x="160" y="320" width="84" height="10" rx="1" fill="rgba(136,135,128,0.4)" stroke="#888780" stroke-width="0.5"/>
    <rect x="160" y="332" width="82" height="10" rx="1" fill="rgba(93,202,165,0.55)" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="248" y="328" fill="#888780" font-family="monospace">83.87</text>
    <text x="246" y="340" fill="#5DCAA5" font-family="monospace">81.91</text>

    <text x="40" y="358" fill="#B4B2A9">MLP</text>
    <rect x="160" y="350" width="86" height="10" rx="1" fill="rgba(136,135,128,0.4)" stroke="#888780" stroke-width="0.5"/>
    <rect x="160" y="362" width="85" height="10" rx="1" fill="rgba(93,202,165,0.55)" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="250" y="358" fill="#888780" font-family="monospace">85.75</text>
    <text x="249" y="370" fill="#5DCAA5" font-family="monospace">84.50</text>
  </g>

  <g transform="translate(370, 304)">
    <rect x="0" y="0" width="14" height="10" rx="1" fill="rgba(136,135,128,0.4)" stroke="#888780" stroke-width="0.5"/>
    <text x="20" y="9" fill="#B4B2A9" font-size="10" font-family="system-ui,sans-serif">base MAE</text>
    <rect x="100" y="0" width="14" height="10" rx="1" fill="rgba(93,202,165,0.55)" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="120" y="9" fill="#B4B2A9" font-size="10" font-family="system-ui,sans-serif">+BECH MAE</text>
  </g>

  <text x="380" y="346" font-size="10" fill="#888780" font-family="system-ui,sans-serif">LSTM 73.35→72.57 | Trans 76.21→75.33 | GBDT 113.60→110.03</text>
</svg>